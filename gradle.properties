#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# KMP import flags matching the real project — enableKgpDependencyResolution changes how
# the IDE resolves KMP dependencies during Gradle import (candidate trigger for the bug).
kotlin.mpp.import.enableKgpDependencyResolution=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=false

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true